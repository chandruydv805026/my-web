<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ratu Fresh - Chat with Priya ✨</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .gradient-bg {
            background: radial-gradient(circle at top, #1e293b 0%, #0f172a 100%);
        }
        
        .glass-card {
            background: rgba(30, 41, 59, 0.75);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .ai-orb-container {
            position: relative;
            width: 130px;
            height: 130px;
            margin: 0 auto;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .ai-orb {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #38bdf8, #0284c7 60%, #0369a1 100%);
            box-shadow: 0 0 30px rgba(56, 189, 248, 0.35), inset 0 0 15px rgba(255, 255, 255, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            color: white;
            transition: all 0.3s ease;
        }

        .orb-listening .ai-orb {
            background: radial-gradient(circle at 30% 30%, #4ade80, #22c55e 60%, #15803d 100%);
            box-shadow: 0 0 45px rgba(74, 222, 128, 0.6), inset 0 0 20px rgba(255, 255, 255, 0.6);
            animation: orb-pulse-green 1s infinite alternate;
        }

        .orb-speaking .ai-orb {
            background: radial-gradient(circle at 30% 30%, #fb923c, #ea580c 60%, #c2410c 100%);
            box-shadow: 0 0 45px rgba(251, 146, 60, 0.6), inset 0 0 20px rgba(255, 255, 255, 0.6);
            animation: orb-pulse-orange 0.8s infinite alternate;
        }

        .orb-thinking .ai-orb {
            background: radial-gradient(circle at 30% 30%, #a855f7, #7e22ce 60%, #581c87 100%);
            box-shadow: 0 0 45px rgba(168, 85, 247, 0.6), inset 0 0 20px rgba(255, 255, 255, 0.6);
            animation: orb-spin 1.2s linear infinite;
        }

        @keyframes orb-pulse-green {
            0% { transform: scale(1); box-shadow: 0 0 25px rgba(74, 222, 128, 0.4); }
            100% { transform: scale(1.08); box-shadow: 0 0 50px rgba(74, 222, 128, 0.8); }
        }

        @keyframes orb-pulse-orange {
            0% { transform: scale(1); box-shadow: 0 0 25px rgba(251, 146, 60, 0.4); }
            100% { transform: scale(1.1); box-shadow: 0 0 55px rgba(251, 146, 60, 0.85); }
        }

        .pulse-ring {
            position: absolute;
            inset: -12px;
            border-radius: 50%;
            border: 2px solid rgba(56, 189, 248, 0.3);
            animation: ring-expand 1.5s linear infinite;
            pointer-events: none;
        }

        @keyframes ring-expand {
            0% { transform: scale(0.95); opacity: 0.8; }
            100% { transform: scale(1.35); opacity: 0; }
        }
    </style>
</head>
<body class="gradient-bg min-h-screen text-slate-100 font-sans flex items-center justify-center p-4">

    <div class="glass-card w-full max-w-sm rounded-3xl p-6 shadow-2xl space-y-6 text-center border border-slate-700/50">
        
        <!-- Header -->
        <div class="flex items-center justify-between border-b border-slate-700/60 pb-4">
            <div class="flex items-center space-x-2">
                <span class="w-3 h-3 bg-emerald-400 rounded-full animate-ping"></span>
                <span class="text-xs font-semibold text-emerald-400 tracking-wider uppercase">Ratu Fresh AI</span>
            </div>
            <span class="text-xs text-slate-400 bg-slate-800/80 px-2.5 py-1 rounded-full border border-slate-700">Voice Studio</span>
        </div>

        <!-- Title -->
        <div>
            <h2 class="text-xl font-bold text-white tracking-wide">Priya Voice Assistant</h2>
            <p class="text-xs text-slate-400 mt-1">ताज़ी सब्ज़ियों की जानकारी के लिए टैप करके बोलें 🥬</p>
        </div>

        <!-- 3D AI Voice Orb Graphics -->
        <div class="py-2">
            <div id="aiOrbContainer" class="ai-orb-container">
                <div class="pulse-ring"></div>
                <div id="aiOrb" class="ai-orb">
                    <i id="orbIcon" class="fa-solid fa-microphone text-2xl"></i>
                </div>
            </div>
        </div>

        <!-- Dynamic Status Message -->
        <div class="space-y-2 min-h-[40px]">
            <div id="statusText" class="text-sm font-semibold text-sky-400 tracking-wide">Tap Orb to Start</div>
        </div>

        <!-- Priya Reply Box -->
        <div id="responseBox" class="hidden bg-slate-900/90 rounded-2xl p-4 border border-emerald-500/30 text-left space-y-1 shadow-inner">
            <div class="flex items-center space-x-2 text-emerald-400 font-semibold text-xs">
                <i class="fa-solid fa-sparkles"></i>
                <span>Priya:</span>
            </div>
            <p id="replyText" class="text-sm text-slate-200 leading-relaxed"></p>
        </div>

    </div>

    <script>
        const aiOrbContainer = document.getElementById('aiOrbContainer');
        const orbIcon = document.getElementById('orbIcon');
        const statusText = document.getElementById('statusText');
        const responseBox = document.getElementById('responseBox');
        const replyText = document.getElementById('replyText');

        let mediaRecorder;
        let audioChunks = [];
        let isFirstClick = true;
        let currentAudioInstance = null;
        let selectedMimeType = 'audio/webm';

        // 📱 Detect Mobile Native Supported Audio Format
        if (MediaRecorder.isTypeSupported('audio/webm')) {
            selectedMimeType = 'audio/webm';
        } else if (MediaRecorder.isTypeSupported('audio/mp4')) {
            selectedMimeType = 'audio/mp4';
        } else if (MediaRecorder.isTypeSupported('audio/aac')) {
            selectedMimeType = 'audio/aac';
        }

        aiOrbContainer.addEventListener('click', async () => {
            unlockMobileAudio();
            stopPriyaVoice();

            if (isFirstClick) {
                isFirstClick = false;
                setOrbState('thinking', "Connecting to Priya...");
                const welcomeText = "नमस्ते! स्वागत है रातू फ्रेश में। मैं प्रिया हूँ। बोलिए भैया, क्या चाहिए?";
                
                setOrbState('speaking', "Priya Speaking...");
                await speakWithSwaraVoice(welcomeText, () => {
                    startRecordingProcess();
                });
            } else {
                if (mediaRecorder && mediaRecorder.state === "recording") {
                    stopRecordingProcess();
                } else {
                    startRecordingProcess();
                }
            }
        });

        function unlockMobileAudio() {
            const silentAudio = new Audio("data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA");
            silentAudio.play().catch(() => {});
        }

        async function startRecordingProcess() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                audioChunks = [];
                
                mediaRecorder = new MediaRecorder(stream, { mimeType: selectedMimeType });
                
                mediaRecorder.ondataavailable = (e) => {
                    if (e.data.size > 0) audioChunks.push(e.data);
                };

                mediaRecorder.onstop = async () => {
                    setOrbState('thinking', "Priya Thinking...");
                    const audioBlob = new Blob(audioChunks, { type: selectedMimeType });
                    await sendDataToBackend(audioBlob);
                };

                mediaRecorder.start();
                setOrbState('listening', "Listening... Tap Orb to Stop & Send");
            } catch (err) {
                alert("Microphone permission allowed nahi hai! Settings se mic allow karein.");
                setOrbState('waiting', "Tap Orb to Retry");
                isFirstClick = true;
            }
        }

        function stopRecordingProcess() {
            if (mediaRecorder && mediaRecorder.state === "recording") {
                mediaRecorder.stop();
                // Stream tracks clear karna zaroori hai mic release karne ke liye
                if (mediaRecorder.stream) {
                    mediaRecorder.stream.getTracks().forEach(track => track.stop());
                }
            }
        }

        function stopPriyaVoice() {
            if (currentAudioInstance) {
                currentAudioInstance.pause();
                currentAudioInstance.currentTime = 0;
                currentAudioInstance = null;
            }
        }

        async function sendDataToBackend(audioBlob) {
            const formData = new FormData();
            formData.append('audioBlob', audioBlob, 'user-voice.webm');
            formData.append('userText', "Instagram Audio");
            formData.append('userName', "Instagram Visitor");

            try {
                const res = await fetch('/api/ratu-fresh-ai', {
                    method: 'POST',
                    body: formData
                });
                const data = await res.json();
                
                if (data.success) {
                    responseBox.classList.remove('hidden');
                    replyText.innerText = data.reply;
                    
                    setOrbState('speaking', "Priya Replying...");
                    await speakWithSwaraVoice(data.reply, () => {
                        setOrbState('waiting', "Tap Orb to Speak Again");
                    });
                } else {
                    setOrbState('waiting', "Tap Orb to Retry");
                }
            } catch (err) {
                setOrbState('waiting', "Server Error. Tap to Retry");
            }
        }

        function setOrbState(state, statusMsg) {
            statusText.innerText = statusMsg;
            aiOrbContainer.className = "ai-orb-container";
            
            if (state === 'listening') {
                aiOrbContainer.classList.add('orb-listening');
                orbIcon.className = "fa-solid fa-ear-listen text-2xl text-white";
                statusText.className = "text-sm font-semibold text-emerald-400 tracking-wide";
            } else if (state === 'speaking') {
                aiOrbContainer.classList.add('orb-speaking');
                orbIcon.className = "fa-solid fa-volume-high text-2xl text-white";
                statusText.className = "text-sm font-semibold text-orange-400 tracking-wide";
            } else if (state === 'thinking') {
                aiOrbContainer.classList.add('orb-thinking');
                orbIcon.className = "fa-solid fa-circle-notch text-2xl text-white animate-spin";
                statusText.className = "text-sm font-semibold text-purple-400 tracking-wide";
            } else {
                orbIcon.className = "fa-solid fa-microphone text-2xl text-white";
                statusText.className = "text-sm font-semibold text-sky-400 tracking-wide";
            }
        }

        async function speakWithSwaraVoice(text, onEndCallback) {
            try {
                stopPriyaVoice();

                const response = await fetch('/api/generate-tts', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        text: text,
                        voice: "hi-IN-SwaraNeural",
                        rate: "+30%"
                    })
                });

                if (!response.ok) throw new Error("Voice Fetch Error");

                const audioBlob = await response.blob();
                const audioUrl = URL.createObjectURL(audioBlob);
                currentAudioInstance = new Audio(audioUrl);

                currentAudioInstance.playbackRate = 1.15;

                currentAudioInstance.onended = () => {
                    currentAudioInstance = null;
                    if (onEndCallback) onEndCallback();
                };

                currentAudioInstance.onerror = () => {
                    currentAudioInstance = null;
                    if (onEndCallback) onEndCallback();
                };

                await currentAudioInstance.play();
            } catch (error) {
                console.error("Swara voice play error:", error);
                if (onEndCallback) onEndCallback();
            }
        }
    </script>
</body>
</html>
